//
// ZQS Cloud 設備／閘道器端 payload 契約（應用層 profile）。
//
// 線上真正傳的位元組永遠是 sparkplug_b.proto 的 `Payload`（Eclipse Tahu 原版，
// 同資料夾）。這一份描述的是 ZQS 平台「在 Sparkplug metric 上約定了什麼」：
// 哪些 metric 名稱有特殊意義、型別是什麼、命令與回覆怎麼對應。它有兩個用途：
//
//   1. 給邊緣端當型別化的資料結構（用 protoc 產生 C / C# / Go / LabVIEW 可用的
//      struct），再依每個欄位註解的「→ metric」對照填進 Sparkplug Payload。
//   2. 當作可機讀的規格：欄位名、型別、必填與否一次寫清楚，比散在文件裡可靠。
//
// 對照規則（每個欄位的註解都以「→」標出 Sparkplug metric 名稱與 Sparkplug 型別）：
//   * 訊息型別與 topic：spBv1.0/{group}/{NBIRTH|NDEATH|DBIRTH|DDEATH|DDATA|DCMD|NCMD}/{node}[/{device}]
//   * 命名空間：Properties/、Capabilities/、Ratings/（只在 BIRTH）、Alarm/、Event/、
//     Command/（DDATA／DCMD）、Node Control/、Device Control/。其餘 metric 一律是量測值。
//   * 量測值名稱用小寫 snake_case（battery_soc、grid_power_w）；平台會把任何名稱
//     正規化成 metric key，但邊緣端直接用正規化後的名稱最省事。
//   * 全部時間戳為 UTC epoch 毫秒（Sparkplug 慣例）。
//
// 完整規格與逐步握手流程見 docs/device-protocol.html。
//
syntax = "proto3";

package zqs.profile.v1;

option java_package = "cloud.zqs.profile.v1";
option csharp_namespace = "Zqs.Profile.V1";
option go_package = "zqscloud/profile/v1;profilev1";

// ---------------------------------------------------------------------------
// 共用
// ---------------------------------------------------------------------------

// 一個 Sparkplug metric 的值。對應 Payload.Metric 的 oneof value；
// datatype 用 Sparkplug 的數值代碼（見 sparkplug_b.proto 的 DataType）。
message Value {
  oneof value {
    int64 int_value = 1;      // Int8/16/32/64、UInt8/16/32 → int_value / long_value
    uint64 uint_value = 2;    // UInt64
    double double_value = 3;  // Float / Double
    bool bool_value = 4;      // Boolean
    string string_value = 5;  // String / Text / UUID
    int64 datetime_ms = 6;    // DateTime（UTC epoch ms）
    bytes bytes_value = 7;    // Bytes
  }
}

// 一筆量測值。→ Payload.Metric{name 或 alias, datatype, timestamp, value}
message Measurement {
  string name = 1;          // 例：battery_soc、grid_power_w。DBIRTH 必填；DDATA 可只帶 alias
  uint64 alias = 2;         // DBIRTH 宣告後，DDATA 可用 alias 省頻寬（平台以 BIRTH 的對照表解析）
  uint32 datatype = 3;      // Sparkplug DataType 代碼（Double=10、Int32=3、Boolean=11、String=12、DateTime=13…）
  int64 timestamp_ms = 4;   // 取樣時間；0 表示沿用 payload.timestamp
  Value value = 5;
  bool is_transient = 6;    // → Metric.is_transient：顯示但不入庫（瞬間值、進度）
  string unit = 7;          // 選填，→ Metric.properties["engUnit"]；平台目錄已有單位時可省
}

// ---------------------------------------------------------------------------
// BIRTH：設備自我宣告（只在 DBIRTH；宣告「可以說，不能做」——平台驗收後才採用）
// ---------------------------------------------------------------------------

// 身分。→ Properties/<Name>（String，Schema Version 為 Int32）
message Identity {
  string category = 1;        // → Properties/Category：battery、pcs、generation、meter、load、
                              //   generator、ev_charger、controller、sensor、gateway。驗收後不可變更
  string manufacturer = 2;    // → Properties/Manufacturer
  string model = 3;           // → Properties/Model
  string serial_number = 4;   // → Properties/Serial Number
  uint32 schema_version = 5;  // → Properties/Schema Version：本 profile 版本，目前 1；缺省視為最新
}

// 執行狀態。→ Properties/<Name>；平台直接寫進設備列
message DeviceStatus {
  string firmware = 1;   // → Properties/Firmware
  string hardware = 2;   // → Properties/Hardware
  string ip = 3;         // → Properties/IP
  int32 rssi_dbm = 4;    // → Properties/RSSI（Int32）
  double latitude = 5;   // → Properties/Latitude（Double）
  double longitude = 6;  // → Properties/Longitude（Double）
  string address = 7;    // → Properties/Address
}

// 能力旗標。→ Capabilities/<Name>（Boolean）。平台以「命令名稱＋參數值」檢查：
// 負功率設定點需要 can_charge、正功率需要 can_discharge、匯出限制 > 0 需要 can_export。
message Capabilities {
  bool can_charge = 1;       // → Capabilities/Can Charge
  bool can_discharge = 2;    // → Capabilities/Can Discharge
  bool can_export = 3;       // → Capabilities/Can Export
  bool is_dispatchable = 4;  // → Capabilities/Is Dispatchable
}

// 銘牌額定。→ Ratings/<Name>（Double）
message Ratings {
  double rated_power_kw = 1;    // → Ratings/Rated Power kW
  double rated_energy_kwh = 2;  // → Ratings/Rated Energy kWh
  double min_soc_percent = 3;   // → Ratings/Min SOC Percent
  double max_soc_percent = 4;   // → Ratings/Max SOC Percent
}

// DBIRTH 的完整內容：宣告 ＋ 這台設備會回報的每一個量測值（含目前值）。
// 平台把 BIRTH 定義為「設備提供的全部 metric」——之後 DDATA 只能用這裡出現過的名稱／alias。
message DeviceBirth {
  Identity identity = 1;
  DeviceStatus status = 2;
  Capabilities capabilities = 3;
  Ratings ratings = 4;
  repeated Measurement measurements = 5;  // 每一個 metric 都要帶值（Sparkplug 要求）
  repeated Alarm alarms = 6;              // 目前仍在作用中的告警，讓平台重生後狀態一致
}

// NBIRTH：閘道器（edge node）自己的出生。→ 必帶 bdSeq（Int64）與 Node Control/Rebirth（Boolean=false）
message NodeBirth {
  int64 bd_seq = 1;                        // → bdSeq：每次 MQTT 連線 +1，NBIRTH 與 NDEATH（will）要一致
  bool rebirth_supported = 2;              // → Node Control/Rebirth：宣告可接受重生要求（一律 true）
  map<string, string> properties = 3;      // → Properties/<Name>：閘道器韌體、型號等
}

// ---------------------------------------------------------------------------
// 告警與事件（DDATA）
// ---------------------------------------------------------------------------

enum AlarmSeverity {
  ALARM_SEVERITY_UNSPECIFIED = 0;
  ALARM_SEVERITY_INFO = 1;
  ALARM_SEVERITY_WARNING = 2;
  ALARM_SEVERITY_MAJOR = 3;
  ALARM_SEVERITY_CRITICAL = 4;
}

// 一個有狀態的故障。→ metric "Alarm/<code>"（Boolean：true 發生、false 解除），
// properties: severity（"info"|"warning"|"major"|"critical"）、message（String）。
// 同一個 code 的 true/false 對應同一筆平台告警的開與關；平台會分別通知「發生／解除」。
message Alarm {
  string code = 1;               // 例：A0007；只能含字母數字與 -_
  bool active = 2;
  AlarmSeverity severity = 3;
  string message = 4;
  map<string, string> details = 5;  // 其餘 properties 原樣存進告警 details
}

enum EventLevel {
  EVENT_LEVEL_UNSPECIFIED = 0;
  EVENT_LEVEL_INFO = 1;
  EVENT_LEVEL_NOTICE = 2;
  EVENT_LEVEL_WARNING = 3;
  EVENT_LEVEL_ERROR = 4;
  EVENT_LEVEL_CRITICAL = 5;
}

// 一行運轉日誌，無狀態。→ metric "Event/<code>"（String = message），properties: level。
message Event {
  string code = 1;      // 例：E0231
  EventLevel level = 2;
  string message = 3;
  map<string, string> data = 4;  // 其餘 properties 進 DeviceEvent.payload
}

// ---------------------------------------------------------------------------
// 命令（DCMD 下行）與回覆（DDATA 上行）
// ---------------------------------------------------------------------------

// 設定點過期／斷線後邊緣要做什麼（W6 fail-safe）。
enum ExpiryPolicy {
  EXPIRY_POLICY_UNSPECIFIED = 0;
  EXPIRY_POLICY_IDLE = 1;     // "idle"：功率歸零
  EXPIRY_POLICY_HOLD = 2;     // "hold"：維持最後設定點
  EXPIRY_POLICY_RESERVE = 3;  // "reserve"：充到備援水位後停止
}

// set_power_setpoint 的參數。→ Command/power_w（Double）、Command/ramp_s、
// Command/valid_until（String ISO 8601 UTC）、Command/on_expiry（String）。
message SetPowerSetpoint {
  double power_w = 1;             // 正 = 放電、負 = 充電
  double ramp_s = 2;              // 選填 0…3600
  string valid_until = 3;         // 選填；到期後依 on_expiry 自行降級，缺省 = 永不過期（舊行為）
  ExpiryPolicy on_expiry = 4;     // 選填；缺省 idle
}

// 平台下發的一道命令。→ DCMD payload：Command/ID（String UUID）、Command/Name（String）、
// Command/Expires（DateTime）、以及每個參數一個 Command/<param> metric。
// Sparkplug 本身沒有回覆訊息；Command/ID 是本 profile 為稽核加的關聯鍵。
message Command {
  string id = 1;                  // → Command/ID：回覆時原樣帶回
  string name = 2;                // → Command/Name：set_power_setpoint、set_mode、set_export_limit、
                                  //   emergency_stop、reboot、clear_alarms、set_report_interval…（依藍圖）
  int64 expires_ms = 3;           // → Command/Expires：過期後不要執行，直接回 expired
  map<string, Value> params = 4;  // → Command/<param>；set_power_setpoint 見 SetPowerSetpoint
}

// 命令生命週期狀態。→ Command/Status（String，小寫）
enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_ACCEPTED = 1;   // "accepted"：收到、開始執行（選填的中間狀態）
  COMMAND_STATUS_SUCCEEDED = 2;  // "succeeded"
  COMMAND_STATUS_REJECTED = 3;   // "rejected"：設備拒絕（能力不符、參數超出範圍、鎖定中）
  COMMAND_STATUS_FAILED = 4;     // "failed"：執行失敗
  COMMAND_STATUS_EXPIRED = 5;    // "expired"：收到時已過 Command/Expires
}

// 設備對命令的回覆。→ DDATA：Command/ID、Command/Status、Command/Message（選填）、
// Command/Result/<key>（選填）。建議同一個 DDATA 一併帶上受影響的量測值（例如新的 battery_power_w）。
message CommandAck {
  string id = 1;
  CommandStatus status = 2;
  string message = 3;
  map<string, Value> result = 4;
}

// ---------------------------------------------------------------------------
// 週期回報（DDATA）
// ---------------------------------------------------------------------------

// 一次 DDATA 的內容。→ Payload{timestamp, seq, metrics[]}。
// seq 每則訊息 +1（0…255 循環）；平台偵測到跳號會用 NCMD Node Control/Rebirth=true 要求重生。
message DeviceData {
  int64 timestamp_ms = 1;
  uint32 seq = 2;
  repeated Measurement measurements = 3;
  repeated Alarm alarms = 4;
  repeated Event events = 5;
  repeated CommandAck acks = 6;
}

// 市電停電判準用的量測（關口電表）。平台看的是 grid_voltage_v 低於方案門檻且持續 N 秒，
// 停電時請如實回報 0，不要用最後有效值填補。
message GridMeterSample {
  double grid_power_w = 1;         // 正 = 購電、負 = 逆送
  double grid_voltage_v = 2;
  double grid_frequency_hz = 3;
  double grid_import_energy_kwh = 4;  // 累計計數器；回捲時平台記 null，不會算成負值
  double grid_export_energy_kwh = 5;
}

// 電池／PCS 的最小回報集合（其餘量測值依目錄自由加）。
message BatterySample {
  double battery_power_w = 1;      // 正 = 放電、負 = 充電
  double battery_soc = 2;          // %
  double battery_soh = 3;          // %
  double battery_temperature_c = 4;
  string pcs_state = 5;            // "charge" | "discharge" | "idle" | "fault"
  double battery_charge_energy_kwh = 6;
  double battery_discharge_energy_kwh = 7;
}
