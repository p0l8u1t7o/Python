<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>ZQS Cloud</title>
    <!-- Declared explicitly. Without a link element every browser still asks
         for /favicon.ico by itself, and a console error on every page load
         teaches people to stop reading the console. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/logo.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong palette while React boots.
      (function () {
        try {
          var stored = localStorage.getItem('zqs.theme') || 'system';
          var dark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
