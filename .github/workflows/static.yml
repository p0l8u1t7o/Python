name: Publish 3D demos to GitHub Pages

# TestCode 底下每個有 web/index.html 的資料夾都是一個展示專案（說明在 project.json）。
# 先跑快速檢查，沒過就不發佈；網址配置與本機 node TestCode/core/tools/serve.mjs 相同。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Quick checks
        run: node TestCode/core/tools/check.mjs --quick

      - name: Build site
        run: node TestCode/core/tools/build-site.mjs _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
