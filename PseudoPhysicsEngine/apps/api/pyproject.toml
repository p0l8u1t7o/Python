[project]
name = "ppe-api"
version = "0.1.0"
description = "HTTP API and SQLite transaction boundary for PseudoPhysicsEngine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.20,<1.21",
  "fastapi>=0.141,<0.142",
  "ppe-coordinate-utils",
  "ppe-domain-models",
  "ppe-schemas",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
ppe-api = "ppe_api.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppe_api"]

[tool.uv.sources]
ppe-coordinate-utils = { workspace = true }
ppe-domain-models = { workspace = true }
ppe-schemas = { workspace = true }
