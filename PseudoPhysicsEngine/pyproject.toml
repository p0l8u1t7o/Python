[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cellforge"
version = "0.1.0"
description = "自動化機台可行性評估平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cadquery>=2.4,<2.7",
  "PyMuPDF>=1.24,<2",
  "xlrd>=2.0,<3",
  "openpyxl>=3.1,<4",
  "numpy>=2.0,<3",
  "python-fcl>=0.7,<0.8",
  "scipy",
  "pydantic>=2.9,<3",
  "ruamel.yaml>=0.18,<0.19",
  "typer>=0.12,<1",
  "trimesh>=4.4,<5",
  "pygltflib>=1.16,<2",
  "Pillow>=10,<13",
  "playwright>=1.47,<2",
  "jsonschema>=4.23,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sse-starlette>=2.1,<4",
  "python-multipart>=0.0.12,<1",
  "ezdxf>=1.3,<2",
  "python-docx>=1.1,<2",
  "imageio-ffmpeg>=0.5,<1",
  "mcp>=1.0,<2",
  "pycollada>=0.8,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "httpx>=0.27,<1"]

[project.scripts]
cell = "cellforge.cli:main"
cellforge-mcp = "cellforge.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["cellforge", "library", "server"]

[tool.hatch.build.targets.wheel.force-include]
"templates/project" = "cellforge/_templates/project"
"web/dist" = "cellforge/_viewer"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # Typer declares CLI options in function defaults by design.
