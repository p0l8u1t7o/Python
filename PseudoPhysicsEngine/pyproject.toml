[project]
name = "pseudo-physics-engine-workspace"
version = "0.1.0"
description = "Automation digital-twin platform workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "httpx2>=2.12,<2.13",
  "hypothesis>=6.140,<7",
  "mypy==2.3.1",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pytest-cov>=7,<8",
  "ruff==0.16.7",
  "uv==0.12.13",
]

[tool.uv.workspace]
members = [
  "apps/api",
  "packages/domain-models",
  "packages/schemas",
  "packages/coordinate-utils",
  "services/worker",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", ".local", "storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
exclude = '(^|/)(\.venv|\.local|storage|node_modules)/'

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
