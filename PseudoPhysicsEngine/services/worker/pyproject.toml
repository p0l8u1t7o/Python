[project]
name = "ppe-worker"
version = "0.1.0"
description = "Durable PseudoPhysicsEngine background worker"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
ppe-worker = "ppe_worker.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppe_worker"]
