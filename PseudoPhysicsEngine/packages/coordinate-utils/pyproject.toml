[project]
name = "ppe-coordinate-utils"
version = "0.1.0"
description = "Right-handed Z-up coordinate and rigid-transform utilities"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0,<3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppe_coordinates"]
