[project]
name = "ppe-schemas"
version = "0.1.0"
description = "Versioned public contracts for PseudoPhysicsEngine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ppe-coordinate-utils",
  "ppe-domain-models",
  "pydantic>=2.13,<2.14",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppe_schemas"]

[tool.uv.sources]
ppe-coordinate-utils = { workspace = true }
ppe-domain-models = { workspace = true }
