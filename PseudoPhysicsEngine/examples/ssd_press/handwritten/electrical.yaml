notes:
- 所有 X 端子、DI/DO 點序與 W 線號為本圖規劃代號，不是已選 PLC／原廠接頭腳位。
- 現場 AC 電壓、相數、中性線需求、短路容量與接地系統待確認；不以圖上線數推定供電制式。
- GC1 只採安全功能連接；安全輸出型式／隔離、測試脈衝、接觸器冗餘與 EDM 配置需按原廠手冊定案。
- K2、端子、保護器與安全轉接為候選新增項；未宣稱安全等級或最終停止類別。
- PE 不經開關／熔絲，門板與機架各自等電位連接；0 V 與 PE 的單點連接策略尚待確認。
- DC 負載的 24 V 額定為選型假設；PLC、光源、感測器與閥必須逐一核對，禁止以展示色當施工線色。
- 補壓針閥沿用 RC8A／手臂工具 I/O 方案；與 PLC 現場輸出分開，不做雙主控。
- 力覺訊號送原廠力控介面，非接一般 DI；壓合力與允收需實物試驗。
- SMEMA 經隔離轉接，兩條傳送方向各自分線；未指定連接器腳位。
- 支撐頂升與止擋到位才允許壓合；相機複檢 NG 後保持載盤並等待處置。
