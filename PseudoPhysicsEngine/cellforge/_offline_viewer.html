<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>__TITLE__</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; color: #e6f1ff; background: #0b1118; font: 14px system-ui, sans-serif; }
      header { height: 58px; padding: 10px 18px; border-bottom: 1px solid #30404f; background: #0e1720; }
      header b { font-size: 18px; }
      header span { margin-left: 12px; color: #8da0b0; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) 350px; height: calc(100vh - 58px); }
      .stage { position: relative; min-width: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      aside { padding: 14px; overflow: auto; border-left: 1px solid #30404f; background: #101922; }
      aside h2 { margin: 0 0 12px; font-size: 15px; }
      .check { width: 100%; display: grid; gap: 5px; margin: 7px 0; padding: 10px; text-align: left; color: #dce7ef; border: 1px solid #314250; border-left: 4px solid #63809a; border-radius: 6px; background: #15212b; }
      .check span { color: #93a5b4; font-size: 11px; }
      .check.red { border-left-color: #f56565; }
      .check.yellow { border-left-color: #ecc94b; }
      .check.green { border-left-color: #48bb78; }
      .controls { position: absolute; right: 14px; bottom: 14px; left: 14px; display: grid; grid-template-columns: 60px minmax(0, 1fr) 70px 105px; gap: 9px; align-items: end; padding: 10px; border: 1px solid #354656; border-radius: 8px; background: #101923e8; }
      button, select, input { font: inherit; }
      button, select { padding: 6px; color: #e5edf4; border: 1px solid #405364; border-radius: 5px; background: #172431; cursor: pointer; }
      #track { position: relative; padding-top: 25px; }
      #time { width: 100%; }
      #segments, #markers { position: absolute; inset: 0 0 auto; height: 21px; }
      #segments button { position: absolute; height: 19px; overflow: hidden; padding: 1px 3px; font-size: 9px; }
      #markers { top: 20px; z-index: 2; pointer-events: none; }
      #markers button { position: absolute; width: 10px; height: 10px; padding: 0; transform: translateX(-50%); border-radius: 50%; pointer-events: auto; }
      #markers .red { background: #f56565; }
      #markers .yellow { background: #ecc94b; }
      #time-label { font-size: 11px; text-align: right; }
      #status { position: absolute; top: 15px; left: 15px; color: #aab9c5; }
    </style>
  </head>
  <body>
    <header><b>__TITLE__</b><span>CellForge offline 3D review · __VERSION__</span></header>
    <main>
      <section class="stage">
        <canvas id="view"></canvas><div id="status"></div>
        <div class="controls">
          <button id="play">播放</button>
          <div id="track"><div id="segments"></div><div id="markers"></div><input id="time" type="range" min="0" step="0.02" value="0" /></div>
          <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
          <b id="time-label"></b>
        </div>
      </section>
      <aside><h2>檢查結果</h2><div id="checks"></div></aside>
    </main>
    <script>window.CELLFORGE_DATA=__PAYLOAD__;</script>
    <script>__BUNDLE__</script>
  </body>
</html>
