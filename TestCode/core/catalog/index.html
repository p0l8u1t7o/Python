<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>共用 3D 模型目錄</title>
<script type="importmap">
{ "imports": {
    "three": "../vendor/three.module.js",
    "three/addons/": "../vendor/addons/",
    "@core/": "../"
} }
</script>
<style>
:root { --bg: #0d1117; --panel: #141c26; --line: #2b3a4a; --text: #e6edf3; --muted: #9fb0c0; --accent: #6edbd4; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
#app { display: grid; grid-template-columns: 240px 1fr 300px; height: 100%; }
aside, #props { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 16px; }
#props { border-right: 0; border-left: 1px solid var(--line); }
h1 { font-size: 18px; margin: 0 0 4px; } h2 { font-size: 12px; color: var(--muted); letter-spacing: .08em; margin: 18px 0 6px; }
a.back { color: var(--accent); font-size: 12px; text-decoration: none; }
#list button { display: block; width: 100%; text-align: left; background: none; color: var(--text); border: 1px solid transparent; border-radius: 6px; padding: 6px 8px; font: inherit; cursor: pointer; }
#list button:hover, #list button.on { border-color: var(--accent); background: #1a2633; }
#view { position: relative; min-width: 0; } #c { width: 100%; height: 100%; display: block; }
#title { position: absolute; left: 16px; top: 12px; font-size: 18px; font-weight: 600; text-shadow: 0 1px 4px #000; }
label.row { display: grid; grid-template-columns: 1fr 70px; gap: 4px 8px; align-items: center; margin: 8px 0; font-size: 13px; }
label.row input[type=range] { grid-column: 1 / -1; accent-color: var(--accent); }
label.row output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
pre { background: #0b1118; border: 1px solid var(--line); border-radius: 6px; padding: 10px; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
button.act { background: #1a2633; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
.muted { color: var(--muted); font-size: 12px; }
@media (max-width: 860px) { #app { grid-template-columns: 1fr; grid-template-rows: auto 55vh auto; } aside, #props { border: 0; } }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>共用 3D 模型目錄</h1>
    <a class="back" href="../../">← 回展示首頁</a>
    <div id="list"></div>
    <p class="muted">模型都在 <code>TestCode/core/models</code>，各專案以 <code>@core/models/…</code> 引用。新增模型後在 <code>models/index.js</code> 登記即會出現在這裡，並納入 core 統一檢查。</p>
  </aside>
  <main id="view"><canvas id="c"></canvas><div id="title"></div></main>
  <section id="props">
    <h2>參數</h2><div id="params"></div>
    <h2>動作狀態</h2><div id="states"></div><button class="act" id="animate">▶ 來回動作</button>
    <h2>用法</h2><pre id="usage"></pre>
    <h2>來源</h2><p class="muted" id="source"></p>
  </section>
</div>
<script type="module" src="catalog.js"></script>
</body>
</html>
