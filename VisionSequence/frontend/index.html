<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionSequence</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231abb9c'/%3E%3Cpath d='M8 12V9.5A1.5 1.5 0 0 1 9.5 8H12M20 8h2.5A1.5 1.5 0 0 1 24 9.5V12M24 20v2.5a1.5 1.5 0 0 1-1.5 1.5H20M12 24H9.5A1.5 1.5 0 0 1 8 22.5V20' stroke='white' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='16' cy='16' r='4.5' stroke='white' stroke-width='2' fill='none'/%3E%3Ccircle cx='17.6' cy='14.4' r='1.1' fill='white'/%3E%3C/svg%3E" />
    <script>
      // 第一次繪製前套用主題風格與語言，避免閃一下錯的配色（清單與 ThemeProvider 的 THEMES、i18n 的 Language 同步）。
      try {
        const t = localStorage.getItem('vs.theme')
        const dark = t === 'dark' || t === 'cyber' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        if (t === 'cyber') document.documentElement.classList.add('theme-cyber')
        const l = localStorage.getItem('vs.language')
        if (l === 'en' || l === 'zh-Hant' || l === 'zh-Hans') document.documentElement.lang = l
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 瀏覽器太舊（Tailwind v4 需要 color-mix 與 @property）時 React 還沒載入就先說清楚，不留一片白 -->
    <div id="browser-notice" hidden style="font: 14px/1.6 system-ui, sans-serif; padding: 24px; max-width: 40rem; margin: 10vh auto; color: #111; background: #fff; border: 1px solid #ccc; border-radius: 8px">
      <strong>VisionSequence needs a newer browser.</strong><br />
      Supported: Chrome or Edge 111+, Firefox 128+, Safari 16.4+. Please update the browser on this PC and reload the page.
    </div>
    <script>
      try {
        var ok = window.CSS && CSS.supports('color', 'color-mix(in srgb, red, blue)') && CSS.supports('selector(:has(a))') && typeof structuredClone === 'function'
        if (!ok) document.getElementById('browser-notice').hidden = false
      } catch (e) {
        document.getElementById('browser-notice').hidden = false
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
