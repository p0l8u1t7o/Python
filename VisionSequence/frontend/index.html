<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionSequence</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231abb9c'/%3E%3Cpath d='M8 12V9.5A1.5 1.5 0 0 1 9.5 8H12M20 8h2.5A1.5 1.5 0 0 1 24 9.5V12M24 20v2.5a1.5 1.5 0 0 1-1.5 1.5H20M12 24H9.5A1.5 1.5 0 0 1 8 22.5V20' stroke='white' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='16' cy='16' r='4.5' stroke='white' stroke-width='2' fill='none'/%3E%3Ccircle cx='17.6' cy='14.4' r='1.1' fill='white'/%3E%3C/svg%3E" />
    <script>
      // 第一次繪製前套用主題風格，避免閃一下錯的配色（清單與 ThemeProvider 的 THEMES 同步）。
      try {
        const t = localStorage.getItem('vs.theme')
        const dark = t === 'dark' || t === 'cyber' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        if (t === 'cyber') document.documentElement.classList.add('theme-cyber')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
