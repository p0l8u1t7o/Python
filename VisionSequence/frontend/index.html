<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionSequence</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314b8a6'/%3E%3Ctext x='16' y='21' font-family='Segoe UI,Arial,sans-serif' font-size='14' font-weight='700' text-anchor='middle' fill='white'%3EVS%3C/text%3E%3C/svg%3E" />
    <script>
      // 第一次繪製前套用主題風格，避免閃一下錯的配色（清單與 ThemeProvider 的 THEMES 同步）。
      try {
        const t = localStorage.getItem('vs.theme')
        const dark = t === 'dark' || t === 'cyber' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        if (t === 'cyber') document.documentElement.classList.add('theme-cyber')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
