[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xrayvision"
dynamic = ["version"]
description = "X-ray semiconductor inspection image analysis platform"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
xrayvision = "xrayvision.cli:main"

# 外部檢測模組套件以此群組宣告 entry point，例如：
# [project.entry-points."xrayvision.inspections"]
# void = "xrayvision_void:VoidInspection"

[tool.setuptools.dynamic]
version = { attr = "xrayvision.__version__" }

[tool.setuptools.packages.find]
include = ["xrayvision*"]

[tool.setuptools.package-data]
xrayvision = ["i18n/*.json", "keys/*.pem", "selftest/*.tiff", "selftest/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/module_template/tests"]
markers = ["regression: full regression image set (slower)", "slow: end-to-end tests that start real service processes"]
